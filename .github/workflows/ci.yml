name: ci

# The Go gates run through latere-ai/ci's reusable pipeline, which probes this
# Makefile and runs the targets it finds. The checks live in
# latere.ai/x/ci-gate, pinned in go.mod, so each of them runs identically from
# a laptop: `make test`, `make cover`, `make spec-lint` and the rest need
# nothing but this checkout.
#
# The Postgres suite stays here. It needs a service container, which a
# reusable workflow has no way to declare on a caller's behalf, and
# ledger/pgledger's tests skip themselves without TEST_DATABASE_URL rather
# than fail. A skipped suite is the failure mode this job exists to prevent.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    uses: latere-ai/ci/.github/workflows/go-verify.yml@v1

  postgres:
    name: ledger against a real Postgres
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pay
          POSTGRES_USER: pay
          POSTGRES_DB: pay_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test with race
        run: make test-race
        env:
          TEST_DATABASE_URL: postgres://pay:pay@localhost:5432/pay_test?sslmode=disable
