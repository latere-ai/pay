name: Feature request
description: Something the library does not do yet, such as a processor, an operation of the ledger or a currency.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What you are trying to do and where the library stops you. Describe
        the problem rather than a solution, so we can look for the best one
        together.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. How you would solve it, and any solution you would rather avoid.

  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: Optional. How you work around the problem now.
