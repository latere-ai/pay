# The per-push gate configuration for pay. Every check runs from
# latere.ai/x/ci-gate, pinned in go.mod, so a gate that fails on a runner
# fails the same way on a laptop.

hermetic:
  # Nothing besides the Go toolchain. This repository's suite reaches no
  # system binary: the Stripe adapter is exercised against an in-process fake,
  # and the Postgres store's tests skip when TEST_DATABASE_URL is unset rather
  # than shelling out to find a server. The empty list is what keeps that
  # true, since the first test to reach for psql or curl would fail here.
  allow: []

spec:
  # One status, because every spec here records a surface that shipped. A
  # closed vocabulary of one is the strongest form of the check: anything
  # else in the tree is either a typo or a lifecycle nobody agreed to.
  # `archived` is the terminal status; `implemented` is a shipped spec kept at
  # the root as the live record.
  status: [implemented, archived]
  # The specs describe their surfaces in Markdown tables, and a row whose
  # cell count drifts renders as silently missing columns.
  tables: true
  archive:
    dir: .archive
    statuses: [archived]

cover:
  # Ninety-five, above the shared floor: the ledger is money, and the pure
  # logic sits in packages with no device and no network.
  threshold: 95.0
  exempt:
    # The value is the reason. lateregate rejects an empty one.
    paytest: >-
      a conformance suite: most of its remaining statements are t.Errorf calls
      that run only when an implementation under test is broken, and reaching
      them would mean faking a *testing.T rather than testing anything real
    ledgertest: >-
      a conformance suite, as paytest; its logic runs on every store and
      adapter test here and in every consumer, which a statement counter does
      not see
    pgledger: >-
      every statement needs a Postgres server and its tests skip without
      TEST_DATABASE_URL; the suite runs against a real server in this
      repository's own postgres job, the only place that can host one

license:
  # The identifier every source file carries and the holder it names. There
  # is no default: this is the decision the gate checks the tree against.
  # `go tool lateregate license -w` writes the notice where it is missing.
  spdx: MIT
  holder: Latere AI
  extensions: ['.go']
  names: [Makefile]

# The identity shape of the family: specs/infrastructure/identity.md in latere-ai/specs
identity:
  role: none

# The database shape: which endpoint the serving path connects on.
postgres:
  # A client library: every entry point takes a pool the caller opened, so
  # the endpoint is the caller's decision. The role records the client
  # import, not a connection this repository makes.
  role: direct

# Staying on the direct endpoint is an exception, so it carries a reason and
# a date. The gate fails the direct role without this entry, and fails it
# again the day after the date, which is when somebody decides whether the
# reason still holds.
waive:
  postgres:
    reason: >-
      a library and not a deployment: nothing here reads a connection
      string or opens a pool, because every entry point takes the pool its
      consumer opened and hands back. There is no serving path in this
      repository to move onto a pooler, and the repository that owns the
      connection is the one the pooled rule applies to. This stops holding
      the day something here opens a connection of its own, which is the
      day it declares pooled and reads a pooled name with a direct
      fallback.
    until: 2026-12-19
